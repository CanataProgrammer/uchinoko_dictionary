<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>彼方の世界 設定資料集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Shippori+Mincho+B1:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/site.js"></script>
</head>
<body class="page-index">

<header class="site-header">
  <a class="site-logo" href="index.html">
    <span class="site-logo-mark">8626</span>
    <span class="site-logo-sub">彼方の世界 設定資料集</span>
  </a>
  <nav class="site-nav" aria-label="メインメニュー">
    <a href="#worlds">Worlds <span class="plus">+</span></a>
    <a href="#characters">Characters <span class="plus">+</span></a>
  </nav>
</header>

<!-- ═══════════════════════════════════════════
     KEY VISUAL
     ═══════════════════════════════════════════ -->
<section class="kv">
  <!-- 背景：城・神社と鳥居・大都市のシルエット（assets/js/site.js で描画） -->
  <div class="kv-scenery" data-scenery="kv" data-seed="8626"></div>
  <div class="kv-inner">
    <h1 class="kv-title">
      <span class="line">彼方の世界<span class="accent">、</span></span>
      <span class="line">設定資料集<span class="accent">。</span></span>
    </h1>
    <p class="kv-sub">8626番地 ― Uchinoko Archive</p>
  </div>
  <p class="kv-vertical">彼方ノ世界　八六二六番地</p>
</section>

<!-- 世界名・キャラクター名が流れる帯（worlds.json から自動で埋まる） -->
<div class="marquee" aria-hidden="true">
  <div class="marquee-track" id="marquee-track"></div>
</div>

<!-- ═══════════════════════════════════════════
     WORLDS
     ═══════════════════════════════════════════ -->
<section class="block" id="worlds">
  <div class="block-head">
    <div class="section-headline">
      <h2 class="section-headline-label">Worlds</h2>
    </div>
    <p class="section-lead">世界を、えらぶ。</p>
    <p class="section-text">世界を選択すると、その世界に生きるキャラクターたちが表示されます。</p>
  </div>

  <div class="world-list" id="world-list" role="group" aria-label="世界選択"></div>

  <div class="world-info" id="world-info">
    <div class="world-info-inner" id="world-info-inner"></div>
  </div>
</section>

<!-- ═══════════════════════════════════════════
     CHARACTERS
     ═══════════════════════════════════════════ -->
<section class="block" id="characters">
  <div class="block-head">
    <div class="section-headline">
      <h2 class="section-headline-label">Characters</h2>
    </div>
    <p class="section-lead">その世界に、生きるひとびと。</p>
  </div>

  <div class="char-toolbar">
    <div class="result-meta" id="result-meta"></div>
    <button class="btn-outline" id="tag-toggle" aria-expanded="false" aria-controls="tag-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
        <line x1="7" y1="7" x2="7.01" y2="7"/>
      </svg>
      タグで絞り込む
    </button>
  </div>

  <div class="tag-panel" id="tag-panel" aria-hidden="true">
    <div class="tag-panel-inner">
      <div class="tag-panel-label">Tags</div>
      <div class="tag-list" id="tag-list"></div>
      <button class="tag-clear" id="tag-clear" style="display:none">× 絞り込みをクリア</button>
    </div>
  </div>

  <div id="char-grid-wrap"></div>
</section>

<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <div class="footer-logo">8626</div>
      <p class="footer-title">彼方の世界(8626番地) 設定資料集</p>
    </div>
    <nav class="footer-nav" aria-label="フッターメニュー">
      <a href="#worlds">Worlds</a>
      <a href="#characters">Characters</a>
    </nav>
  </div>
  <p class="footer-copy">Created by CanataZer0</p>
</footer>

<script>
  const worldList   = document.getElementById('world-list');
  const tagToggle   = document.getElementById('tag-toggle');
  const tagPanel    = document.getElementById('tag-panel');
  const tagListEl   = document.getElementById('tag-list');
  const tagClear    = document.getElementById('tag-clear');
  const worldInfo   = document.getElementById('world-info');
  const worldInfoInner = document.getElementById('world-info-inner');
  const gridWrap    = document.getElementById('char-grid-wrap');
  const resultMeta  = document.getElementById('result-meta');

  const PERSON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>';

  let allData = null;
  let activeTags = new Set();
  let currentWorld = null;

  fetch('data/worlds.json')
    .then(r => r.json())
    .then(data => {
      allData = data;
      buildMarquee(data.worlds);
      buildWorldList(data.worlds);
      buildTagPanel(data.all_tags || []);
      readUrlState();
    })
    .catch(() => {
      gridWrap.innerHTML = '<div class="empty-state"><p>データの読み込みに失敗しました。worlds.json を確認してください。</p></div>';
    });

  function pad(n) { return String(n).padStart(2, '0'); }

  // 世界名とキャラクター名を流れる帯に並べる（2周分つなげて途切れないようにする）
  function buildMarquee(worlds) {
    const names = [];
    worlds.forEach(w => {
      names.push(w.name);
      (w.characters || []).forEach(c => names.push(c.name));
    });
    names.push('Uchinoko Archive');
    const group = names.map(n => `<span class="marquee-item">${esc(n)}</span><span class="marquee-sep"></span>`).join('');
    const track = document.getElementById('marquee-track');
    track.innerHTML = `<div class="marquee-group">${group}${group}</div><div class="marquee-group">${group}${group}</div>`;
  }

  function buildWorldList(worlds) {
    worlds.forEach((w, i) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'world-card';
      card.dataset.id = w.id;
      card.setAttribute('aria-pressed', 'false');
      const count = (w.characters || []).length;
      card.innerHTML = `
        <span class="world-card-num">${pad(i + 1)}</span>
        <span class="world-card-name">${esc(w.name)}</span>
        ${w.description ? `<span class="world-card-desc">${esc(w.description)}</span>` : ''}
        <span class="world-card-foot">
          <span>${count} Characters</span>
          <span class="world-card-check" aria-hidden="true">✓</span>
        </span>`;
      card.addEventListener('click', () => selectWorld(currentWorld && currentWorld.id === w.id ? null : w.id));
      worldList.appendChild(card);
    });
    animateIn(worldList);
  }

  function selectWorld(wid) {
    currentWorld = wid ? allData.worlds.find(w => w.id === wid) || null : null;
    syncWorldCards();
    renderWorldInfo();
    renderGrid();
    updateUrl();
  }

  function syncWorldCards() {
    worldList.querySelectorAll('.world-card').forEach(c => {
      c.setAttribute('aria-pressed', String(!!currentWorld && c.dataset.id === currentWorld.id));
    });
  }

  function buildTagPanel(tags) {
    tagListEl.innerHTML = '';
    tags.forEach(tag => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'tag-chip';
      chip.textContent = tag;
      chip.style.setProperty('--tag-color', tagColor(tag));
      chip.addEventListener('click', () => toggleTag(tag, chip));
      tagListEl.appendChild(chip);
    });
  }

  function toggleTag(tag, chip) {
    if (activeTags.has(tag)) { activeTags.delete(tag); chip.classList.remove('active'); }
    else { activeTags.add(tag); chip.classList.add('active'); }
    tagClear.style.display = activeTags.size > 0 ? 'inline' : 'none';
    renderGrid();
    updateUrl();
  }

  tagClear.addEventListener('click', () => {
    activeTags.clear();
    document.querySelectorAll('.tag-chip.active').forEach(c => c.classList.remove('active'));
    tagClear.style.display = 'none';
    renderGrid();
    updateUrl();
  });

  tagToggle.addEventListener('click', () => {
    const open = tagPanel.classList.toggle('open');
    tagToggle.classList.toggle('active', open);
    tagToggle.setAttribute('aria-expanded', open);
    tagPanel.setAttribute('aria-hidden', !open);
  });

  function renderWorldInfo() {
    if (!currentWorld) { worldInfo.classList.remove('visible'); return; }
    worldInfo.classList.add('visible');
    const thumbHtml = currentWorld.thumbnail
      ? `<img class="world-thumb" src="${esc(currentWorld.thumbnail)}" alt="${esc(currentWorld.name)}" />`
      : '';
    worldInfoInner.innerHTML = `
      ${thumbHtml}
      <div class="world-text">
        <div class="world-name">${esc(currentWorld.name)}</div>
        <div class="world-desc">${esc(currentWorld.description || '')}</div>
      </div>
      ${currentWorld.detail_page
        ? `<a class="btn-pill" href="${esc(currentWorld.detail_page)}">詳細設定を見る <span class="arrow" aria-hidden="true">→</span></a>`
        : ''}`;
    animateIn(worldInfoInner);
  }

  function renderGrid() {
    if (!currentWorld) {
      resultMeta.innerHTML = '';
      gridWrap.innerHTML = `<div class="empty-state">${PERSON_ICON}<p>世界を選択するとキャラクターが表示されます</p></div>`;
      return;
    }

    let chars = currentWorld.characters || [];

    if (activeTags.size > 0) {
      chars = chars.filter(c => [...activeTags].every(t => (c.tags || []).includes(t)));
    }

    resultMeta.innerHTML = `<strong>${chars.length}</strong>人のキャラクター${activeTags.size > 0 ? '（タグで絞り込み中）' : ''}`;

    if (chars.length === 0) {
      gridWrap.innerHTML = `<div class="empty-state">${PERSON_ICON}<p>該当するキャラクターがいません</p></div>`;
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'char-grid';

    chars.forEach((c, i) => {
      const card = document.createElement('a');
      card.className = 'char-card';
      card.href = c.detail_page || '#';
      card.style.animationDelay = `${i * 0.06}s`;
      card.setAttribute('aria-label', c.name);

      const thumbHtml = c.thumbnail
        ? `<img class="char-thumb" src="${esc(c.thumbnail)}" alt="${esc(c.name)}" loading="lazy" />`
        : `<div class="char-thumb-placeholder">${PERSON_ICON}</div>`;

      const tagsHtml = (c.tags || []).slice(0, 3).map(t =>
        `<span class="char-tag-mini" style="--tag-color:${tagColor(t)}">${esc(t)}</span>`
      ).join('');

      card.innerHTML = `
        <div class="char-thumb-wrap">${thumbHtml}</div>
        <div class="char-info">
          <span class="char-num">${pad(i + 1)}</span>
          <div class="char-name">${esc(c.name)}</div>
          ${c.reading ? `<div class="char-reading">${esc(c.reading)}</div>` : ''}
          ${c.short_description ? `<p class="char-desc">${esc(c.short_description)}</p>` : ''}
          ${tagsHtml ? `<div class="char-tags-mini">${tagsHtml}</div>` : ''}
          <span class="char-arrow" aria-hidden="true">→</span>
        </div>`;

      grid.appendChild(card);
    });

    gridWrap.innerHTML = '';
    gridWrap.appendChild(grid);
  }

  function updateUrl() {
    const params = new URLSearchParams();
    if (currentWorld) params.set('world', currentWorld.id);
    if (activeTags.size > 0) params.set('tags', [...activeTags].join(','));
    const url = params.toString() ? `?${params}` : location.pathname;
    history.replaceState(null, '', url + location.hash);
  }

  function readUrlState() {
    const params = new URLSearchParams(location.search);
    const wid = params.get('world');
    const tags = params.get('tags');
    // 世界が1つだけなら最初から選択しておく
    const initial = wid || (allData.worlds.length === 1 ? allData.worlds[0].id : null);
    if (initial) currentWorld = allData.worlds.find(w => w.id === initial) || null;
    if (tags) {
      tags.split(',').forEach(t => {
        activeTags.add(t);
        const chip = [...tagListEl.querySelectorAll('.tag-chip')].find(c => c.textContent === t);
        if (chip) chip.classList.add('active');
      });
      tagClear.style.display = activeTags.size > 0 ? 'inline' : 'none';
    }
    syncWorldCards();
    renderWorldInfo();
    renderGrid();
  }

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
