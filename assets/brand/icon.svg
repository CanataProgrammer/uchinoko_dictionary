<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- サイトアイコン：夜空の月と光輪、城（左）・神社と鳥居（中央）・大都市（右）のシルエット -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30365a"/>
      <stop offset="1" stop-color="#1c1f31"/>
    </linearGradient>
    <clipPath id="frame"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="64" height="64" fill="url(#sky)"/>

    <!-- 月と光輪 -->
    <circle cx="47" cy="15" r="6" fill="#f6e7c1"/>
    <circle cx="47" cy="15" r="10" fill="none" stroke="#e0553b" stroke-width="1.2" stroke-dasharray="1.6 2.4" opacity="0.85"/>

    <!-- 城（左） -->
    <g fill="#4a5180">
      <rect x="2.5" y="30" width="5.5" height="34"/>
      <path d="M1.5 30 L5.25 21.5 L9 30 Z"/>
      <path d="M8 64 V37 h1.6 v-2 h1.8 v2 h1.8 v-2 h1.8 v2 h1.8 v-2 h1.8 v2 h1.8 v-2 h1.4 V64 Z"/>
      <rect x="10.5" y="27" width="6" height="11"/>
      <path d="M9.5 27 L13.5 16.5 L17.5 27 Z"/>
    </g>
    <path d="M13.2 16.5 h0.6 v-4.5 l3.2 1.3 l-3.2 1.3 z" fill="#e0553b"/>
    <rect x="12.6" y="30" width="1.8" height="2.6" rx="0.9" fill="#f2c66b"/>

    <!-- 大都市（右） -->
    <g fill="#4a5180">
      <rect x="45" y="35" width="6.5" height="29"/>
      <rect x="51.5" y="28" width="7.5" height="36"/>
      <rect x="54.9" y="21" width="0.8" height="7"/>
      <rect x="59" y="38" width="6" height="26"/>
    </g>
    <g fill="#f2c66b">
      <rect x="46.8" y="38" width="1.2" height="1.6"/><rect x="48.9" y="42.5" width="1.2" height="1.6"/>
      <rect x="53.4" y="31.5" width="1.2" height="1.6"/><rect x="56.2" y="35.5" width="1.2" height="1.6"/>
      <rect x="53.4" y="44" width="1.2" height="1.6"/><rect x="60.8" y="42" width="1.2" height="1.6"/>
    </g>

    <!-- 神社の丘と社殿 -->
    <path d="M12 64 Q23 52 32 51 Q41 52 52 64 Z" fill="#262a44"/>
    <path d="M26 50.5 Q29.5 50 30.4 46.6 L33.6 46.6 Q34.5 50 38 50.5 Z" fill="#7b82b3"/>
    <rect x="27.6" y="50.5" width="8.8" height="4" fill="#7b82b3"/>
    <path d="M30 47 l-1.2 -2 M34 47 l1.2 -2" stroke="#7b82b3" stroke-width="0.8"/>

    <!-- 鳥居（朱色） -->
    <g fill="#e0553b">
      <path d="M17 31 Q32 35.5 47 31 L46.5 34.6 Q32 38.6 17.5 34.6 Z"/>
      <rect x="20" y="36.4" width="24" height="2"/>
      <rect x="30.9" y="37.6" width="2.2" height="3.6"/>
      <rect x="20.5" y="41" width="23" height="2.2"/>
      <rect x="22.5" y="35.5" width="3.4" height="28.5"/>
      <rect x="38.1" y="35.5" width="3.4" height="28.5"/>
    </g>
  </g>
</svg>
