<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <title>埋め込み画像の元データ</title>
  <!-- Discord / X などのリンク埋め込み画像（og-image.png 1200×630）の元になるページ。
       トップページと同じ site.js でシルエットを描く。
       作り直すときは assets/brand/README.md の手順で書き出す。 -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/site.js"></script>
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background: linear-gradient(180deg, #e9ebf3 0%, #efece8 48%, #f4ebe2 78%, #f6f4ef 100%);
    }

    /* 書き出し用：アニメーションを止めて完成状態で描く */
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .scene .mote { opacity: 0.8; }

    .og-scene { position: absolute; left: 0; right: 0; bottom: 0; height: 60%; }

    .og-text { position: absolute; left: 76px; top: 46px; z-index: 2; }

    .og-eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-en);
      font-style: italic;
      font-weight: 600;
      font-size: 30px;
      color: var(--ink-soft);
    }

    .og-eyebrow::before {
      content: '';
      width: 34px;
      height: 28px;
      background: var(--shu);
      -webkit-mask: var(--torii-mark) no-repeat center / contain;
      mask: var(--torii-mark) no-repeat center / contain;
    }

    .og-title {
      margin-top: 18px;
      font-family: var(--font-serif);
      font-weight: 800;
      font-size: 76px;
      line-height: 1.3;
      letter-spacing: 0.1em;
      color: var(--ink);
    }

    .og-title span { display: block; }
    .og-title span + span { padding-left: 1.4em; }
    .og-title b { color: var(--shu); font-weight: 800; }

  </style>
</head>
<body>
  <div class="og-scene" data-scenery="kv" data-seed="8626"></div>
  <div class="og-text">
    <p class="og-eyebrow">8626番地 ― Uchinoko Archive</p>
    <h1 class="og-title"><span>彼方の世界<b>、</b></span><span>設定資料集<b>。</b></span></h1>
  </div>
</body>
</html>
